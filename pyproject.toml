[project]
name = "crash-to-contact"
version = "0.1.0"
description = "Compliance-gated geospatial lead pipeline for motor-vehicle crash data"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.2",          # DuckDB .fetchdf() results
    "httpx>=0.27",          # MoCo / TxDOT / FARS ingesters, Census ACS client
    "h3>=4.0",
    "timezonefinder>=8.0",
    "pyproj>=3.6",          # CRS reprojection in src/geo/crs.py
    "pydantic>=2.9",
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "contracts*", "orchestration*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
