[project]
name = "crash-to-contact"
version = "0.1.0"
description = "Compliance-gated geospatial lead pipeline for motor-vehicle crash data"
requires-python = ">=3.12"
dependencies = [
    # ── Core data ──
    "duckdb>=1.1.0",
    "pyarrow>=17.0",
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",

    # ── Ingestion ──
    "httpx>=0.27",
    "requests>=2.32",

    # ── Geospatial ──
    "h3>=4.0",
    "timezonefinder>=8.0",

    # ── Data contracts ──
    "pydantic>=2.9",

    # ── Orchestration ──
    "dagster>=1.8",
    "dagster-webserver>=1.8",

    # ── Spatial analysis ──
    "esda>=2.6",
    "libpysal>=4.12",
    "scikit-learn>=1.5",
    "scipy>=1.14",

    # ── Utilities ──
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "contracts*", "orchestration*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
